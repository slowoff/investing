name: Update Prices

on:
  schedule:
    - cron: '0 17 * * 1-5'   # 17:00 UTC weekdays (market close SIX/XETRA)
  workflow_dispatch:           # manual trigger button in GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and write prices.json
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, datetime

          def get_yf(ticker):
              url = f"https://query2.finance.yahoo.com/v8/finance/chart/{ticker}?interval=1d&range=1d"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  d = json.loads(r.read())
              m = d["chart"]["result"][0]["meta"]
              return m["regularMarketPrice"], m["currency"]

          def get_fx(base):
              with urllib.request.urlopen(f"https://api.frankfurter.app/latest?from={base}&to=CHF", timeout=10) as r:
                  return json.loads(r.read())["rates"]["CHF"]

          eur_chf = get_fx("EUR")
          gbp_chf = get_fx("GBP")

          # S&P 500 Xtrackers — XDPU on XETRA (EUR)
          price_sp, _ = get_yf("XDPU.DE")
          sp_chf = round(price_sp * eur_chf, 4)

          # EQQQ Nasdaq 100 — EQQQ on LSE (GBp = pence, divide by 100)
          price_eq, _ = get_yf("EQQQ.L")
          eq_chf = round((price_eq / 100) * gbp_chf, 4)

          out = {
              "S&P 500 (Xtrackers)": sp_chf,
              "EQQQ Nasdaq 100":     eq_chf,
              "eur_chf":             round(eur_chf, 4),
              "gbp_chf":             round(gbp_chf, 4),
              "updated":             datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }
          with open("prices.json", "w") as f:
              json.dump(out, f, indent=2)
          print("Done:", out)
          PYEOF

      - name: Commit prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "no change" || (git commit -m "prices $(date -u +%Y-%m-%d)" && git push)
