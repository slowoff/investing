name: Update Prices

on:
  schedule:
    - cron: '0 17 * * 1-5'   # 17:00 UTC weekdays (after SIX/XETRA close)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yfinance
        run: pip install yfinance --quiet

      - name: Fetch prices and write prices.json
        run: |
          python3 << 'PYEOF'
          import yfinance as yf
          import json, datetime

          def get_price_chf(ticker_str, multiply=1.0):
              t = yf.Ticker(ticker_str)
              info = t.fast_info
              price = info.last_price
              ccy   = info.currency
              print(f"  {ticker_str}: {price} {ccy}")
              return price * multiply, ccy

          # Get FX rates via yfinance (no external FX API needed)
          eur_chf = yf.Ticker("EURCHF=X").fast_info.last_price
          gbp_chf = yf.Ticker("GBPCHF=X").fast_info.last_price
          print(f"EUR/CHF: {eur_chf}")
          print(f"GBP/CHF: {gbp_chf}")

          # S&P 500: XDPU.DE (EUR on XETRA)
          price_sp, ccy_sp = get_price_chf("XDPU.DE")
          sp_chf = round(price_sp * eur_chf, 4)

          # EQQQ: EQQQ.L (GBp on LSE — divide by 100 for GBP)
          price_eq, ccy_eq = get_price_chf("EQQQ.L")
          eq_chf = round((price_eq / 100) * gbp_chf, 4)

          print(f"S&P 500 → {sp_chf} CHF")
          print(f"EQQQ    → {eq_chf} CHF")

          out = {
              "S&P 500 (Xtrackers)": sp_chf,
              "EQQQ Nasdaq 100":     eq_chf,
              "eur_chf":             round(eur_chf, 4),
              "gbp_chf":             round(gbp_chf, 4),
              "updated":             datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }
          with open("prices.json", "w") as f:
              json.dump(out, f, indent=2)
          print("Written:", out)
          PYEOF

      - name: Commit prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "no change" || (git commit -m "prices $(date -u +%Y-%m-%d)" && git push)
